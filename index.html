/* Слайды 9:16 «как сторис» + тёмный редактор в духе Figma */
:root{
  color-scheme:dark;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--paper);font-family:var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.im.ph{display:grid;place-items:center;text-align:center;font:800 3.6cqw var(--ui);color:rgba(255,255,255,.9);

.im.ph b{display:block;font-size:14cqw;margin-bottom:2cqw}
.shp{width:100%;height:100%}

.deco{position:absolute;z-index:-1;pointer-events:none}

.deco.ring{border-radius:50%;border:5cqw dashed currentColor}
.deco.stripe{left:-20%;right:-20%;height:18cqw;transform:rotate(-12deg)}
.deco.heart{bottom:-10%;font-size:6cqw}
.deco.star{font-size:5cqw}
.play .deco.blob{animation:dfloat 9s ease-in-out infinite alternate}
.play .deco.ring{animation:dspin 18s linear infinite}
.play .deco.heart{animation:dup linear infinite}
.play .deco.star{animation:dtw 2.4s ease-in-out infinite alternate}

@keyframes a-rise{from{opacity:0;transform:translateY(7cqw)}}

@keyframes l-pulse{to{transform:scale(1.07)}}
@keyframes l-wiggle{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

.estage{grid-area:stage;position:relative;display:grid;place-items:center;overflow:hidden;padding:14px;

.h.se{right:-10px;bottom:-10px;cursor:nwse-resize}

.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 10px;font-size:13px;font-weight:800;color:var(--ed-mute);white-space:nowrap}

.sec{display:flex;flex-direction:column;gap:10px}

      case 'publish': this.publish(); break;

      case 'colorauto': this.push(); e.color = ''; this.after(true); break;
      case 'center': this.push(); e.x = 50 - e.w / 2; this.after(false); break;
      case 'front': case 'back': { this.push(); const i = s.els.indexOf(e); s.els.splice(i, 1); s.els.splice(a === 'front' ? Math.min(s.els.length, i + 1) : Math.max(0, i - 1), 0, e); this.after(false); toast(a === 'front' ? 'На слой выше' : 'На слой ниже', 1200); break; }
      case 'dup': { this.push(); const c = clone(e); c.id = uid(); c.x += 3; c.y += 2; s.els.push(c); this.sel = c.id; this.after(true); break; }
      case 'del': this.push(); s.els = s.els.filter(x => x !== e); this.sel = null; this.tab = 'add'; this.after(true); break;
      case 'replaceimg': { const f = await pick('image/*'); if (!f) return; const r = await compressImage(f); const id = uid(); this.media[id] = r.url; this.push(); e.media = id; e.ratio = r.ratio; this.after(true); break; }
      case 'imgratio': { if (!e.ratio) { toast('Сначала загрузи фото'); return; } this.push(); const can = this.can.getBoundingClientRect(); e.h = e.w * can.width * e.ratio / can.height; this.after(false); break; }
      case 'sup': case 'sdown': { this.push(); const j = this.cur + (a === 'sup' ? -1 : 1); const arr = this.st.slides; [arr[this.cur], arr[j]] = [arr[j], arr[this.cur]]; this.cur = j; this.after(true); break; }
      case 'sdup': { this.push(); const c = clone(s); c.id = uid(); c.els.forEach(x => x.id = uid()); this.st.slides.splice(this.cur + 1, 0, c); this.cur++; this.sel = null; this.after(true); break; }
      case 'sdel': { this.push(); this.st.slides.splice(this.cur, 1); this.sel = null; this.after(true); toast('Слайд удалён. ↶ — вернуть', 2000); break; }
      case 'bgimg': { const f = await pick('image/*'); if (!f) return; const r = await compressImage(f, 1440); const id = uid(); this.media[id] = r.url; this.push(); s.bgImage = id; this.after(true); break; }
      case 'bgdel': this.push(); s.bgImage = ''; this.after(true); break;
      case 'bgall': this.push(); this.st.slides.forEach(x => { if (x !== s) Object.assign(x, { bg: s.bg, bg2: s.bg2, angle: s.angle, fg: s.fg, decor: s.decor, accent: s.accent }); }); this.after(true); toast('Фон применён ко всем слайдам'); break;
      case 'addtrack': return this.loadTrack();
      case 'pplay': return this.previewPending();
      case 'pcancel': this.stopPrev(); this.pending = null; this.renderPanel(); break;

  },
  async add(kind) {
    const fg = this.slide.fg, ac = this.slide.accent;
    if (kind === 'h1') return this.addEl(H1('Заголовок', 40, { delay: 0 }));
    if (kind === 'p') return this.addEl(P('Напиши здесь что-нибудь нежное', 50, { delay: 0 }));
    if (kind === 'num') return this.addEl(H1('100', 38, { size: 28, color: ac, ls: -.05, lh: .9, anim: 'pop', delay: 0 }));
    if (kind === 'label') return this.addEl(T('надпись', { x: 20, y: 45, w: 60, size: 6, weight: 800, align: 'center', bgc: ac, color: fg, anim: 'pop' }));
    if (kind === 'rect') return this.addEl(S({ shape: 'rect', fill: ac, radius: 3 }));
    if (kind === 'circle') return this.addEl(S({ shape: 'circle', fill: ac, w: 40, h: 22.5 }));
    if (kind === 'heart') return this.addEl(S({ shape: 'heart', fill: ac, w: 40, h: 21, loop: 'pulse' }));
    if (kind === 'img' || kind === 'polaroid') {
      const f = await pick('image/*'); if (!f) return;
      const r = await compressImage(f); const id = uid(); this.media[id] = r.url;
      const can = this.can.getBoundingClientRect(), w = kind === 'polaroid' ? 62 : 76;
      let hh = w * can.width * r.ratio / can.height; if (kind === 'polaroid') hh = w * can.width * (r.ratio * (56 / 62) + 14 / 62) / can.height;
      hh = Math.min(hh, 60);
      return this.addEl(I({ media: id, ratio: r.ratio, w, h: hh, x: 50 - w / 2, y: 50 - hh / 2, frame: kind === 'polaroid', radius: kind === 'polaroid' ? .5 : 4, rot: kind === 'polaroid' ? -3 : 0 }));
    }
  },
  addEl(e) { this.push(); this.slide.els.push(e); this.sel = e.id; this.tab = 'el'; this.after(true); },
  templates() {
    const m = h('div', 'modal');
    const names = { blank:'Пустой', title:'Заголовок', number:'Большая цифра', photo:'Фото', top:'Топ-5', final:'Финал' };
    m.innerHTML = `<div class="sheet"><h3>Новый слайд</h3><div class="tpls">${Object.keys(TEMPLATES).map(k => `<button class="tpl" data-tpl="${k}"><span class="thumb"><span class="canvas" data-prev="${k}"></span></span>${names[k]}</button>`).join('')}</div><button class="b" data-close>Отмена</button></div>`;
    this.r.appendChild(m);
    for (const c of m.querySelectorAll('[data-prev]')) renderSlide(TEMPLATES[c.dataset.prev](), c, this.media);
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); });
  },

  /* ----- музыка в редакторе ----- */
  prev: null,
  stopPrev() { if (this.prev) { this.prev.pause(); clearTimeout(this.prevT); this.prev = null; } },
  async loadTrack() {
    const f = await pick('audio/*,.mp3,.m4a'); if (!f) return;
    const url = URL.createObjectURL(f), a = new Audio(url);
    const dur = await new Promise(res => { a.onloadedmetadata = () => res(a.duration); a.onerror = () => res(0); });
    if (!dur || !isFinite(dur)) { toast('Не получилось прочитать файл. Попробуй mp3'); return; }
    const mp3 = /mpeg|mp3/.test(f.type) || /\.mp3$/i.test(f.name);
    if (!mp3 && f.size > 6 * 1048576) { toast('Файл слишком большой. Возьми mp3: из него можно вырезать кусок'); return; }
    const base = f.name.replace(/\.[^.]+$/, ''), parts = base.split(/\s+[-–—]\s+/);
    this.pending = { file: f, url, dur, mp3, size: f.size, name: parts[1] || base, artist: parts[1] ? parts[0] : '', spotify: '', start: Math.min(45, Math.max(0, Math.floor(dur / 3))), len: Math.min(60, Math.floor(dur)) };
    this.renderPanel();
  },
  previewPending() {
    const p = this.pending; if (!p) return; this.stopPrev();
    const a = new Audio(p.url); this.prev = a; a.currentTime = p.mp3 ? p.start : 0; a.play().catch(() => {});
    this.prevT = setTimeout(() => this.stopPrev(), 12000); toast('Играют первые 12 секунд отрывка', 1600);
  },
  previewTrack(id) {
    const t = this.st.tracks.find(x => x.id === id); if (!t) return;
    if (this.prev && this.prevId === id) { this.stopPrev(); return; }
    this.stopPrev(); const a = new Audio(this.media[t.media]); this.prev = a; this.prevId = id; a.play().catch(() => toast('Не удалось проиграть'));
    this.prevT = setTimeout(() => this.stopPrev(), 15000);
  },
  async commitTrack() {
    const p = this.pending; if (!p) return; this.stopPrev();
    const sp = (p.spotify || '').trim();
    if (sp && !/^https:\/\/(open\.)?spotify\.com\/|^https:\/\/spotify\.link\//.test(sp)) { toast('Ссылка на Spotify должна начинаться с https://open.spotify.com/'); return; }
    const btn = $('[data-a=padd]', this.r); btn.disabled = true; btn.textContent = 'Готовлю…';
    let blob = p.file, len = p.dur;
    if (p.mp3) { const buf = await p.file.arrayBuffer(); len = Math.min(p.len, p.dur - p.start); blob = clipMp3(buf, p.dur, p.start, len); }
    const id = uid(); this.media[id] = await readURL(blob);
    const tr = { id: uid(), name: p.name || 'Без названия', artist: p.artist, spotify: sp, media: id, len };
    this.push(); this.st.tracks.push(tr);
    const firstUse = !this.st.slides.some(s => this.st.tracks.some(t => t.id === s.music.track && t !== tr));
    if (firstUse) this.st.slides[0].music = { track: tr.id, start: 0 };
    URL.revokeObjectURL(p.url); this.pending = null; this.after(true);
    toast(firstUse ? 'Трек добавлен и стоит с первого слайда' : 'Трек добавлен. Выбери его во вкладке «Слайд»', 3000);
  },

  /* ----- холст: выбор, перетаскивание, размер, поворот ----- */
  bindCanvas() {
    const can = this.can; let drag = null, lastTap = { id: null, t: 0 };
    const guides = (vx, vy) => { can.querySelectorAll('.guide').forEach(g => g.remove()); if (vx) can.appendChild(h('div', 'guide v')); if (vy) can.appendChild(h('div', 'guide hz')); };
    can.addEventListener('pointerdown', ev => {
      const hd = ev.target.closest('.h'), node = ev.target.closest('.el');
      if (!node) { this.select(null); return; }
      const id = node.dataset.id; if (!hd) this.select(id);
      const e = this.el; if (!e) return;
      const now = Date.now();
      if (!hd && lastTap.id === id && now - lastTap.t < 380 && e.type === 'text') { this.tab = 'el'; this.renderPanel(); const ta = $('#eltext', this.r); if (ta) { ta.focus(); ta.select(); } lastTap = { id: null, t: 0 }; return; }
      lastTap = { id, t: now };
      const n = $(`.el[data-id="${id}"]`, can), R = can.getBoundingClientRect();
      drag = { mode: hd ? hd.dataset.h : 'move', e, n, R, sx: ev.clientX, sy: ev.clientY, o: clone(e), before: this.snap(), moved: false, nh: n.offsetHeight / R.height * 100 };
      can.setPointerCapture(ev.pointerId); ev.preventDefault();
    });
    can.addEventListener('pointermove', ev => {
      if (!drag) return;
      const { e, n, R, o } = drag, dx = (ev.clientX - drag.sx) / R.width * 100, dy = (ev.clientY - drag.sy) / R.height * 100;
      if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 4) return;
      drag.moved = true;
      if (drag.mode === 'move') {
        let x = o.x + dx, y = o.y + dy; const hh = e.type === 'text' ? drag.nh : e.h;
        const sx = Math.abs(x + e.w / 2 - 50) < 1.5, sy = Math.abs(y + hh / 2 - 50) < 1.2;
        if (sx) x = 50 - e.w / 2; if (sy) y = 50 - hh / 2;
        e.x = +x.toFixed(2); e.y = +y.toFixed(2); guides(sx, sy);
      } else if (drag.mode === 'se') {
        if (e.type === 'text') { const f = Math.max(.15, (o.w + dx) / o.w); e.w = +(o.w * f).toFixed(2); e.size = +clamp(o.size * f, 1, 60).toFixed(2); n.querySelector('.tx').style.fontSize = e.size + 'cqw'; }
        else { e.w = +Math.max(4, o.w + dx).toFixed(2); e.h = +Math.max(2, o.h + dy).toFixed(2); }
      } else if (drag.mode === 'e') e.w = +Math.max(8, o.w + dx).toFixed(2);
      else if (drag.mode === 'r') {
        const b = n.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
        let ang = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI + 90; if (ang > 180) ang -= 360;
        for (const s of [-180, -90, -45, 0, 45, 90, 180]) if (Math.abs(ang - s) < 4) ang = s;
        e.rot = Math.round(ang);
      }
      placeEl(n, e);
    });
    const end = () => {
      if (!drag) return; guides(false, false);
      if (drag.moved) { this.hist.push(drag.before); this.fut = []; this.lastKey = ''; this.after(false); if (this.tab === 'el') this.renderPanel(); }
      drag = null;
    };
    can.addEventListener('pointerup', end); can.addEventListener('pointercancel', end);
    if (this._kb) return; this._kb = true;
    document.addEventListener('keydown', ev => {
      if (!this.open || $('.modal')) return;
      const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName);
      const mod = ev.ctrlKey || ev.metaKey;
      if (mod && ev.key.toLowerCase() === 'z') { if (typing) return; ev.preventDefault(); ev.shiftKey ? this.redo() : this.undo(); return; }
      if (typing || !this.el) return;
      const e = this.el;
      if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); this.push(); this.slide.els = this.slide.els.filter(x => x !== e); this.sel = null; this.after(true); }
      else if (mod && ev.key.toLowerCase() === 'd') { ev.preventDefault(); const c = clone(e); c.id = uid(); c.x += 3; c.y += 2; this.push(); this.slide.els.push(c); this.sel = c.id; this.after(true); }
      else if (ev.key.startsWith('Arrow')) { ev.preventDefault(); const st = ev.shiftKey ? 2 : .5; this.push('nudge' + e.id); if (ev.key === 'ArrowLeft') e.x -= st; if (ev.key === 'ArrowRight') e.x += st; if (ev.key === 'ArrowUp') e.y -= st; if (ev.key === 'ArrowDown') e.y += st; this.after(false); }

const TEMPLATES = {
  blank: () => slide({ bg:'#7b2ff7', fg:'#f6f1e9', accent:'#ffd23f', decor:'none' }),

  number: () => slide({ bg:'#1db954', fg:'#0b0b0f', accent:'#7b2ff7', decor:'ring', els:[ K('Мы сделали это', 37), H1('42', 41, { size:30, color:'#7b2ff7', ls:-.05, lh:.9, anim:'pop' }), P('раза. И сделаем ещё.', 58) ] }),
  photo: () => slide({ bg:'#ffd23f', fg:'#0b0b0f', accent:'#ff4f8b', decor:'blobs', duration:7, els:[ K('Момент', 12.5), I({ y:16.5, h:47, rot:-2.5 }), H1('Подпись к фото', 66.5, { size:7.4 }), P('Что тогда было.', 73.5, { delay:1.1 }) ] }),
  top: () => slide({ bg:'#0b0b0f', fg:'#f6f1e9', accent:'#ff4f8b', decor:'stripes', duration:9, els:[ K('Топ-5', 24), H1('Лучшее за год', 28, { size:7.4 }),
    ...['Первое', 'Второе', 'Третье', 'Четвёртое', 'Пятое'].flatMap((t, j) => [ T(String(j + 1), { x:8, y:38 + j * 7.4, w:10, font:'Unbounded', weight:900, size:8.5, color:'#ff4f8b', lh:1, anim:'left', delay:.7 + j * .45 }), T(t, { x:20, y:39.2 + j * 7.4, w:74, weight:800, size:5, lh:1.2, anim:'left', delay:.75 + j * .45 }) ]) ] }),
  final: () => slide({ bg:'#e8114f', fg:'#f6f1e9', accent:'#ffd23f', decor:'hearts', duration:12, els:[ K('И главное', 36), H1('Я люблю тебя.', 40, { loop:'pulse' }), P('Последние слова.', 57) ] }),
};

/* =================== запуск =================== */
let canEdit = /(^|#)edit$/.test(location.hash);
function showEditBtn() {
  if (!canEdit || $('.editbtn')) return;
  const b = h('button', 'editbtn', '✏️ Редактор'); b.onclick = () => { b.remove(); Ed.start(); };
  document.body.appendChild(b);
}
openViewer(PUB.state, PUB.media);
showEditBtn();
(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [user, art] = await Promise.all([window.claude.use('user'), window.claude.use('artifact')]);
    Ed.art = art;
    if (user && art && await user.canEdit()) canEdit = true;
  } catch {}
  if (canEdit && sget('reopenEditor')) { sset('reopenEditor', null); const b = $('.editbtn'); b && b.remove(); Ed.start(); return; }
  showEditBtn();
})();
})();
